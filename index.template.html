<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axis AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#111111;
    --card:#141212;
    --pill:#161414;
    --border:#232323;
    --border-soft:#2a2222;
    --text:#e5e3dd;
    --text-dim:#999999;
    --text-faint:#666666;
    --accent:#d9534f;
    --accent-dim:#1c1414;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Share Tech Mono',monospace;
    height:100vh;
    overflow:hidden;
  }
  .app{display:flex;height:100vh}

  /* Sidebar */
  .sidebar{
    width:260px;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:20px;
    overflow-y:auto;
  }
  .sidebar-top{display:flex;justify-content:space-between;align-items:center}
  .icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px}
  .new-chat{
    display:flex;align-items:center;gap:8px;
    color:var(--text);font-size:13px;
    background:none;border:none;cursor:pointer;
    padding:6px 0;
  }
  .new-chat i{color:var(--accent)}
  .section-label{font-size:10px;color:var(--text-faint);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
  .integration-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;color:var(--text-dim);cursor:pointer}
  .integration-row.active i{color:var(--accent)}
  .integration-row.active span{color:var(--text)}
  .integration-row i{font-size:15px;color:var(--text-faint)}
  .chat-item{
    font-size:12px;color:#aaa;padding:6px 0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  }
  .chat-item:hover{color:var(--text)}

  /* Main pane */
  .main{flex:1;display:flex;flex-direction:column;padding:24px 28px;overflow:hidden}
  .main-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .brand{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text)}
  .avatar{
    width:28px;height:28px;border-radius:50%;
    background:var(--accent-dim);border:1px solid #d9534f33;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--accent);
  }

  .greeting{margin-bottom:24px}
  .greeting-sub{color:var(--text-dim);font-size:14px}
  .greeting-main{
    font-family:'Syne',sans-serif;font-weight:500;
    font-size:28px;color:#eceae5;line-height:1.3;
  }

  .suggestions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .pill{
    background:var(--pill);border:1px solid var(--border-soft);
    border-radius:20px;padding:8px 16px;
    color:#ccc;font-size:12px;
    display:flex;align-items:center;gap:6px;
    cursor:pointer;
  }
  .pill i{color:var(--accent);font-size:14px}
  .pill:hover{border-color:var(--accent)}

  /* Chat log */
  .chat-log{
    flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;
    padding:8px 0;
  }
  .msg-user{align-self:flex-end;max-width:78%;background:#1a1a1a;border-radius:14px 14px 4px 14px;padding:10px 14px}
  .msg-user p{color:#dcdad4;font-size:12.5px;line-height:1.6}
  .msg-ai{align-self:flex-start;max-width:82%;display:flex;gap:10px}
  .msg-ai .icon{width:24px;height:24px;border-radius:7px;background:var(--accent-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .msg-ai .icon i{font-size:13px;color:var(--accent)}
  .msg-ai p{color:#e5e3dd;font-size:12.5px;line-height:1.7;padding-top:2px}

  /* Input bar */
  .input-bar{
    background:var(--card);border-radius:16px;
    padding:12px 16px;margin-top:16px;
  }
  .input-placeholder{color:var(--text-faint);font-size:12px;margin-bottom:10px}
  .input-row{display:flex;justify-content:space-between;align-items:center}
  .input-row textarea{
    flex:1;background:none;border:none;color:var(--text);
    font-family:'Share Tech Mono',monospace;font-size:13px;
    resize:none;outline:none;
  }
  .send-btn{
    width:30px;height:30px;background:var(--accent-dim);border:none;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .send-btn i{color:var(--accent);font-size:14px}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn"><i class="ti ti-menu-2"></i></button>
      <button class="icon-btn"><i class="ti ti-search"></i></button>
    </div>

    <button class="new-chat" id="newChatBtn">
      <i class="ti ti-plus"></i> New chat
    </button>

    <div>
      <div class="section-label">Integrations</div>
      <div class="integration-row active" data-service="canvas">
        <i class="ti ti-school"></i><span>Canvas</span>
      </div>
      <div class="integration-row" data-service="gmail">
        <i class="ti ti-mail"></i><span>Gmail</span>
      </div>
      <div class="integration-row" data-service="slack">
        <i class="ti ti-brand-slack"></i><span>Slack</span>
      </div>
      <div class="integration-row" data-service="github">
        <i class="ti ti-brand-github"></i><span>GitHub</span>
      </div>
      <div class="integration-row" data-service="notion">
        <i class="ti ti-notes"></i><span>Notion</span>
      </div>
      <div class="integration-row" data-service="teams">
        <i class="ti ti-users"></i><span>Teams</span>
      </div>
      <div class="integration-row" data-service="canva">
        <i class="ti ti-palette"></i><span>Canva</span>
      </div>
    </div>

    <div>
      <div class="section-label">Chats</div>
      <div id="chatHistoryList"></div>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <span class="brand">Axis</span>
      <div class="avatar" id="userAvatar">R</div>
    </div>

    <div id="greetingScreen">
      <div class="greeting">
        <div class="greeting-sub">Hi <span id="userName">Rico</span></div>
        <div class="greeting-main">Where should we start?</div>
      </div>

      <div class="suggestions">
        <div class="pill" data-prompt="Check my Canvas assignments">
          <i class="ti ti-school"></i>Check Canvas
        </div>
        <div class="pill" data-prompt="Draft an email">Draft an email</div>
        <div class="pill" data-prompt="Summarize a repo">Summarize a repo</div>
      </div>
    </div>

    <div class="chat-log" id="chatLog" style="display:none"></div>

    <div class="input-bar">
      <div class="input-placeholder">Ask Axis</div>
      <div class="input-row">
        <button class="icon-btn" id="attachBtn"><i class="ti ti-plus"></i></button>
        <textarea id="chatInput" rows="1" placeholder="Message Axis..."></textarea>
        <button class="send-btn" id="sendBtn"><i class="ti ti-arrow-up"></i></button>
      </div>
    </div>
  </main>

</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script>
(function(){
  const chatLog = document.getElementById('chatLog');
  const greetingScreen = document.getElementById('greetingScreen');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const chatHistoryList = document.getElementById('chatHistoryList');
  const suggestions = document.querySelectorAll('.pill');
  const integrationRows = document.querySelectorAll('.integration-row');

  let currentChatId = null;
  let chatHistory = []; // { id, title, messages: [{role, content}] }

  function showChatView(){
    greetingScreen.style.display = 'none';
    chatLog.style.display = 'flex';
  }

  function showGreeting(){
    greetingScreen.style.display = 'block';
    chatLog.style.display = 'none';
    chatLog.innerHTML = '';
  }

  function renderUserMsg(text){
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.innerHTML = '<p></p>';
    div.querySelector('p').textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function renderAiMsg(text){
    const div = document.createElement('div');
    div.className = 'msg-ai';
    div.innerHTML = '<div class="icon"><i class="ti ti-sparkles"></i></div><p></p>';
    div.querySelector('p').textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // ---- Wire this to your real backend call ----
  // Replace this stub with the actual fetch() to your chat function/Worker.
  async function sendToAxis(messageText){
  const supabaseToken = session?.access_token;
  if (!supabaseToken) return "You're not logged in.";

  const conversation = chatHistory.find(c => c.id === currentChatId);
  const priorMessages = conversation ? conversation.messages : [];
  const outbound = [...priorMessages, { role: "user", content: messageText }];

  try {
    const res = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + supabaseToken
      },
      body: JSON.stringify({
        messages: outbound,
        provider: "groq",
        model: "llama-3.3-70b-versatile"
      })
    });
    const data = await res.json();

    if (conversation){
      conversation.messages.push({ role: "user", content: messageText });
      conversation.messages.push({ role: "assistant", content: data.reply || "" });
    }

    return data.reply || data.error || "Something went wrong.";
  } catch (e) {
    return "Couldn't reach Axis: " + e.message;
  }
}

  async function handleSend(){
    const text = chatInput.value.trim();
    if(!text) return;
    showChatView();
    renderUserMsg(text);
    chatInput.value = '';

    if(!currentChatId){
      currentChatId = crypto.randomUUID();
      chatHistory.unshift({ id: currentChatId, title: text.slice(0,30), messages: [] });
      renderChatHistoryList();
    }

    const reply = await sendToAxis(text);
    renderAiMsg(reply);
  }

  sendBtn.addEventListener('click', handleSend);
  chatInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });

  newChatBtn.addEventListener('click', function(){
    currentChatId = null;
    showGreeting();
  });

  suggestions.forEach(function(pill){
    pill.addEventListener('click', function(){
      chatInput.value = pill.dataset.prompt;
      handleSend();
    });
  });

  integrationRows.forEach(function(row){
    row.addEventListener('click', function(){
      integrationRows.forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      // TODO: filter/scope chat context to row.dataset.service if needed
    });
  });

  function renderChatHistoryList(){
    chatHistoryList.innerHTML = '';
    chatHistory.forEach(function(chat){
      const div = document.createElement('div');
      div.className = 'chat-item';
      div.textContent = chat.title;
      div.addEventListener('click', function(){
        currentChatId = chat.id;
        showChatView();
        // TODO: reload chat.messages into chatLog
      });
      chatHistoryList.appendChild(div);
    });
  }
})();
</script>
</body>
</html>
